services:
  minio:
    image: quay.io/minio/minio:latest
    container_name: linkforge-minio
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${V2_S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${V2_S3_SECRET_ACCESS_KEY:-minioadmin123}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-*}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  minio-bootstrap:
    image: quay.io/minio/mc:latest
    entrypoint: ["/bin/sh", "/bootstrap/bootstrap_v2_bucket.sh"]
    environment:
      V2_S3_BUCKET: ${V2_S3_BUCKET:-linkforge-dev-v2}
      V2_S3_ENDPOINT: ${V2_S3_ENDPOINT:-http://minio:9000}
      V2_S3_ACCESS_KEY_ID: ${V2_S3_ACCESS_KEY_ID:-minioadmin}
      V2_S3_SECRET_ACCESS_KEY: ${V2_S3_SECRET_ACCESS_KEY:-minioadmin123}
    volumes:
      - ./deploy/minio/bootstrap_v2_bucket.sh:/bootstrap/bootstrap_v2_bucket.sh:ro
      - ./deploy/minio/v2-upload-cors.xml:/bootstrap/v2-upload-cors.xml:ro

volumes:
  minio_data:

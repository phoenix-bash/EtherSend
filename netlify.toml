[build]
base = "apps/frontend"
command = "cd ../.. && corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter frontend build"
publish = ".next"

[[plugins]]
package = "@netlify/plugin-nextjs"

[[redirects]]
from = "/api/*"
to = "https://ethersend-backend.onrender.com/:splat"
status = 200
force = true
